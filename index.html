<script>
const PALETTE = ['#d62b2b','#1e6fff','#c9a84c','#1db87a','#e05500','#9b2dca'];
let peer, conn, isHost = false, myId = null, gameState = null;

// New state variables to handle connection hanging
let isConnecting = false;
let joinTimeout = null;

function initPeer() {
  document.getElementById('conn-loading').style.display = 'block';
  document.getElementById('lobby-inner').style.display = 'none';
  
  // FIX 1: Added explicit Google STUN servers for robust NAT traversal
  peer = new Peer(undefined, { 
    debug: 0,
    config: {
      'iceServers': [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', id => {
    myId = id;
    document.getElementById('myIdText').textContent = id;
    document.getElementById('conn-loading').style.display = 'none';
    document.getElementById('lobby-inner').style.display = 'flex';
    setStatus('hostStatus','● Ready — share your ID','ok');
  });

  peer.on('connection', c => {
    conn = c; isHost = true; setupConn();
    setStatus('hostStatus','● Opponent connected — starting…','ok');
    setTimeout(startGame, 500);
  });

  peer.on('error', e => {
    isConnecting = false;
    setStatus('joinStatus','✕ ' + e.message,'err');
  });
}

function joinGame() {
  if (isConnecting) return; // Prevent spam clicking
  
  const id = document.getElementById('joinIdInput').value.trim();
  if (!id) return;
  
  isConnecting = true;
  setStatus('joinStatus','◌ Connecting…','warn');
  
  // FIX 2: Added reliable flag for game data
  conn = peer.connect(id, { reliable: true });

  // FIX 3: Connection timeout fallback if WebRTC hangs
  clearTimeout(joinTimeout);
  joinTimeout = setTimeout(() => {
    if (isConnecting) {
      isConnecting = false;
      setStatus('joinStatus','✕ Connection timed out. Check ID.','err');
      if (conn) conn.close();
    }
  }, 8000);

  conn.on('open', () => {
    clearTimeout(joinTimeout);
    isConnecting = false;
    setupConn(); 
    setStatus('joinStatus','● Connected — waiting for host','ok'); 
  });
  
  conn.on('error', e => {
    clearTimeout(joinTimeout);
    isConnecting = false;
    setStatus('joinStatus','✕ ' + e.message,'err');
  });
}

function setupConn() {
  conn.on('data', handleMessage);
  conn.on('close', () => {
    if (gameState && gameState.phase !== 'done')
      showResult('📡','Disconnected','Your opponent left the game.');
  });
}

function send(msg) { if (conn && conn.open) conn.send(msg); }

// FIX 4: Added local/HTTP fallback for clipboard copying
function copyId() {
  const triggerVisual = () => {
    const b = document.querySelector('.copy-btn');
    b.textContent = 'Copied!';
    setTimeout(() => b.textContent = 'Copy', 1600);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(myId).then(triggerVisual);
  } else {
    const temp = document.createElement('textarea');
    temp.value = myId;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    document.body.removeChild(temp);
    triggerVisual();
  }
}

function setStatus(id, msg, cls='') {
  const el = document.getElementById(id);
  el.textContent = msg; el.className = 'status ' + cls;
}

function startGame() {
  if (isHost) {
    const sk = parseInt(document.getElementById('hostSkittles').value) || 15;
    gameState = makeState('X','O',sk);
    send({ type:'START', startSkittles: sk });
    initGameUI();
  }
}

function makeState(myM, oppM, sk) {
  return { board:Array(9).fill(null), mySkittles:sk, oppSkittles:sk, myMarker:myM, oppMarker:oppM,
    phase:'select', selectedSquare:null, myBid:null, oppBid:null, currentRound:1, winCells:[], startSkittles:sk };
}

function handleMessage(msg) {
  if (msg.type === 'START') { gameState = makeState('O','X',msg.startSkittles); initGameUI(); return; }
  if (msg.type === 'SELECT') {
    gameState.selectedSquare = msg.square;
    if (msg.square === null) { gameState.phase='select'; gameState.myBid=null; gameState.oppBid=null; renderBoard(); setPhase('select'); return; }
    gameState.phase='bid'; gameState.myBid=null; gameState.oppBid=null;
    renderBoard(); showBidArea(msg.square); setPhase('bid');
    log(`Opponent chose square <span class="lh">${msg.square+1}</span> — place your bid.`); return;
  }
  if (msg.type === 'BID') { gameState.oppBid=msg.bid; log('Opponent placed their bid.'); checkReveal(); return; }
  if (msg.type === 'REMATCH') {
    const sk=gameState.startSkittles;
    gameState = makeState(gameState.oppMarker, gameState.myMarker, sk);
    closeResult(); initGameUI(); log('<span class="lw">Rematch started.</span>'); return;
  }
}

function initGameUI() {
  document.getElementById('screen-lobby').classList.remove('active');
  document.getElementById('screen-game').classList.add('active');
  document.getElementById('myMarkerLabel').textContent = gameState.myMarker;
  document.getElementById('oppMarkerLabel').textContent = gameState.oppMarker;
  document.getElementById('revealArea').style.display = 'none';
  document.getElementById('bidArea').style.display = 'none';
  document.getElementById('waitingBidMsg').style.display = 'none';
  document.getElementById('gameLog').innerHTML = '';
  renderBoard(); renderSkittles(); setPhase('select');
  log('<span class="lw">Game started.</span> Select a square to bid on.');
}

function renderBoard() {
  const el = document.getElementById('board'); el.innerHTML = '';
  gameState.board.forEach((cell,i) => {
    const d = document.createElement('div'); d.className='cell';
    if (cell && cell.voided) {
      d.classList.add('voided'); d.innerHTML=`<span class="cell-void-txt">VOID</span>`;
    } else if (cell && cell.owner) {
      d.classList.add('taken', cell.owner==='X'?'taken-x':'taken-o');
      if (gameState.winCells.includes(i)) d.classList.add('win-cell');
      d.innerHTML=`<span class="cell-marker ${cell.owner.toLowerCase()}">${cell.owner}</span>`;
    } else {
      if (gameState.phase==='select') d.addEventListener('click',()=>selectSquare(i));
      else d.classList.add('disabled');
      if (gameState.selectedSquare===i) d.classList.add('selected');
      d.innerHTML=`<span class="cell-num">${String(i+1).padStart(2,'0')}</span>`;
    }
    el.appendChild(d);
  });
}

function renderSkittles() {
  document.getElementById('mySkittles').textContent = gameState.mySkittles;
  document.getElementById('oppSkittles').textContent = gameState.oppSkittles;
  renderDots('mySkittleRow', gameState.mySkittles, gameState.startSkittles);
  renderDots('oppSkittleRow', gameState.oppSkittles, gameState.startSkittles);
  const s = document.getElementById('bidSlider');
  s.max = gameState.mySkittles;
  if (parseInt(s.value)>gameState.mySkittles) s.value=gameState.mySkittles;
  document.getElementById('sliderMax').textContent = gameState.mySkittles;
  updateBidDisplay();
}

function renderDots(id,rem,total) {
  const el=document.getElementById(id); el.innerHTML='';
  for (let i=0;i<total;i++) {
    const s=document.createElement('span');
    s.className='sdot'+(i>=rem?' spent':'');
    s.style.background=PALETTE[i%PALETTE.length];
    el.appendChild(s);
  }
}

function setPhase(ph) {
  if (gameState) gameState.phase=ph;
  const b=document.getElementById('phaseBadge');
  const map={select:['SELECT SQUARE','phase-select'],bid:['PLACE BID','phase-bid'],waiting_reveal:['LOCKED IN…','phase-bid'],reveal:['REVEALING','phase-reveal'],done:['GAME OVER','phase-done']};
  const [label,cls]=map[ph]||['—',''];
  b.textContent=label; b.className='phase-badge '+cls;
  const ti=document.getElementById('turnIndicator');
  if (ph==='select')          { ti.textContent='▶ SELECT A SQUARE'; ti.className='turn-bar mine'; }
  else if (ph==='bid')        { ti.textContent='▶ PLACE YOUR BID'; ti.className='turn-bar mine'; }
  else if (ph==='waiting_reveal') { ti.textContent='◆ AWAITING OPPONENT…'; ti.className='turn-bar theirs'; }
  else if (ph==='reveal')     { ti.textContent='◆ REVEALING…'; ti.className='turn-bar theirs'; }
  else if (ph==='done')       { ti.textContent='■ GAME OVER'; ti.className='turn-bar theirs'; }
}

function selectSquare(i) {
  if (!gameState||gameState.phase!=='select') return;
  if (gameState.board[i]) return;
  gameState.selectedSquare=i; gameState.myBid=null; gameState.oppBid=null;
  send({ type:'SELECT', square:i });
  renderBoard(); showBidArea(i); setPhase('bid');
  log(`You selected square <span class="lh">${i+1}</span>.`);
}

function showBidArea(sq) {
  document.getElementById('bidArea').style.display='block';
  document.getElementById('waitingBidMsg').style.display='none';
  document.getElementById('bidSquareLabel').textContent=`#${sq+1}`;
  const s=document.getElementById('bidSlider');
  s.max=gameState.mySkittles; s.value=Math.min(1,gameState.mySkittles);
  updateBidDisplay();
}

function cancelBid() {
  if (gameState.myBid!==null) return;
  gameState.selectedSquare=null;
  send({ type:'SELECT', square:null });
  document.getElementById('bidArea').style.display='none';
  renderBoard(); setPhase('select');
}

function updateBidDisplay() {
  document.getElementById('bidValueDisplay').textContent=document.getElementById('bidSlider').value;
}

function confirmBid() {
  const bid=parseInt(document.getElementById('bidSlider').value);
  if (bid<0||bid>gameState.mySkittles) return;
  gameState.myBid=bid; send({ type:'BID', bid });
  document.getElementById('bidArea').style.display='none';
  document.getElementById('waitingBidMsg').style.display='block';
  setPhase('waiting_reveal');
  log(`You bid <span class="lh">${bid}</span> Skittle${bid!==1?'s':''}.`);
  checkReveal();
}

function checkReveal() { if (gameState.myBid!==null&&gameState.oppBid!==null) doReveal(); }

function doReveal() {
  document.getElementById('waitingBidMsg').style.display='none';
  setPhase('reveal');
  const sq=gameState.selectedSquare, myBid=gameState.myBid, oppBid=gameState.oppBid;
  let outcome, rc=['',''];
  if (myBid>oppBid) {
    outcome='win'; rc=['winner','loser'];
    gameState.mySkittles-=myBid; gameState.board[sq]={owner:gameState.myMarker};
    log(`Square ${sq+1} → You <span class="lw">WIN</span> (${myBid} vs ${oppBid})`);
  } else if (oppBid>myBid) {
    outcome='lose'; rc=['loser','winner'];
    gameState.oppSkittles-=oppBid; gameState.board[sq]={owner:gameState.oppMarker};
    log(`Square ${sq+1} → You <span class="ll">LOSE</span> (${myBid} vs ${oppBid})`);
  } else {
    outcome='tie'; rc=['tied','tied'];
    gameState.board[sq]={voided:true};
    log(`Square ${sq+1} → <span class="lv">VOID</span> — both bid ${myBid}`);
  }
  const outcomeText = outcome==='win'?'▲ You claimed the square.' : outcome==='lose'?'▼ Opponent claimed the square.' : '■ Square voided.';
  const ra=document.getElementById('revealArea');
  ra.style.display='block';
  ra.innerHTML=`<div class="reveal-block">
    <div class="reveal-label">Reveal — Square #${sq+1}</div>
    <div class="reveal-row">
      <div class="reveal-box ${rc[0]}"><div class="r-label">You</div><div class="r-amount">${myBid}</div></div>
      <div class="reveal-vs">VS</div>
      <div class="reveal-box ${rc[1]}"><div class="r-label">Opponent</div><div class="r-amount">${oppBid}</div></div>
    </div>
    <div class="reveal-outcome">${outcomeText}</div>
  </div>`;
  document.getElementById('roundCounter').textContent=`RND ${String(gameState.currentRound).padStart(2,'0')}`;
  gameState.currentRound++; renderSkittles();
  
  setTimeout(() => {
    const result=checkWin();
    if (result) {
      gameState.phase='done'; gameState.winCells=result.cells||[]; renderBoard();
      if (result.winner===gameState.myMarker) showResult('🏆','You Win','You outbid your opponent with precision.');
      else if (result.winner==='draw') showResult('🤝','Draw','The board is full — no line completed.');
      else showResult('💀','You Lose','Opponent took control of the board.');
      return;
    }
    setTimeout(() => {
      ra.style.display='none';
      gameState.selectedSquare=null; gameState.myBid=null; gameState.oppBid=null;
      setPhase('select'); renderBoard();
    }, 1800);
  }, 600);
}

function checkWin() {
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const b=gameState.board;
  for (const [a,c,d] of lines) {
    if (b[a]?.owner&&b[a].owner===b[c]?.owner&&b[a].owner===b[d]?.owner)
      return { winner:b[a].owner, cells:[a,c,d] };
  }
  if (b.every(cell=>cell!==null)) return { winner:'draw', cells:[] };
  return null;
}

function showResult(emoji,title,desc) {
  document.getElementById('resultEmoji').textContent=emoji;
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultDesc').textContent=desc;
  document.getElementById('resultOverlay').classList.remove('hidden');
  setPhase('done');
}
function closeResult() { document.getElementById('resultOverlay').classList.add('hidden'); }

function rematch() {
  send({ type:'REMATCH' });
  const sk=gameState.startSkittles;
  gameState=makeState(gameState.oppMarker,gameState.myMarker,sk);
  closeResult(); initGameUI();
}

function backToLobby() {
  closeResult();
  document.getElementById('screen-game').classList.remove('active');
  document.getElementById('screen-lobby').classList.add('active');
  gameState=null;
}

function log(msg) {
  const el=document.getElementById('gameLog');
  const e=document.createElement('div'); e.className='log-entry'; e.innerHTML=msg;
  el.appendChild(e); el.scrollTop=el.scrollHeight;
}

initPeer();
      </script>
