<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>An Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050710;
    --curtain-1:#1c3fd6;
    --curtain-2:#0a1a63;
    --curtain-shadow:#020614;
    --pink:#ff5fa8;
    --pink-light:#ffb3d6;
    --white:#ffffff;
    --card:#0a0e1f;
    --card-border:rgba(255,255,255,0.16);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--void);
    font-family:'Work Sans',sans-serif;
    color:var(--white);
    overflow-x:hidden;
  }
  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:5vh 6vw;
    overflow:hidden;
  }
  .vignette{
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,10,40,0.85) 100%);
    opacity:0.3;
    transition:opacity 0.6s ease;
    pointer-events:none;
    z-index:1;
  }
  .curtain{
    position:absolute;
    top:0;
    bottom:0;
    width:0vw;
    max-width:16vw;
    background:
      repeating-linear-gradient(90deg,
        var(--curtain-1) 0px, var(--curtain-1) 22px,
        var(--curtain-2) 22px, var(--curtain-2) 44px);
    box-shadow:inset -30px 0 60px rgba(0,0,0,0.6);
    transition:width 0.9s cubic-bezier(.7,0,.2,1);
    z-index:1;
  }
  .curtain-left{left:0; box-shadow:inset -40px 0 60px var(--curtain-shadow);}
  .curtain-right{right:0; box-shadow:inset 40px 0 60px var(--curtain-shadow); background:
      repeating-linear-gradient(-90deg,
        var(--curtain-1) 0px, var(--curtain-1) 22px,
        var(--curtain-2) 22px, var(--curtain-2) 44px);}
 
  .card{
    position:relative;
    z-index:10;
    max-width:520px;
    width:100%;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:4px;
    padding:56px 44px;
    text-align:center;
    box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 30px 80px rgba(0,0,0,0.6);
  }
  .card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(255,95,168,0.18);
    pointer-events:none;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--pink);
    margin:0 0 18px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(28px,5vw,42px);
    line-height:1.2;
    margin:0 0 14px;
    color:var(--white);
    transition:opacity 0.25s ease;
    min-height:2.4em;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sub{
    font-size:15px;
    color:var(--pink-light);
    opacity:0.85;
    margin:0 0 40px;
    transition:opacity 0.25s ease;
  }
  .btn-row{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    min-height:120px;
  }
  button{
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    border-radius:999px;
    cursor:pointer;
    border:none;
    transition:all 0.35s cubic-bezier(.34,1.56,.64,1), background 0.2s ease;
  }
  #yesBtn{
    background:var(--pink);
    color:#1a0a14;
    padding:14px 34px;
    font-size:16px;
  }
  #yesBtn:hover{background:var(--pink-light);}
  #noBtn{
    background:transparent;
    color:var(--white);
    border:1px solid rgba(255,255,255,0.4);
    padding:14px 30px;
    font-size:16px;
    position:absolute;
  }
  #noBtn:hover{border-color:var(--white);}
 
  .shake{animation:shake 0.4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px) rotate(-0.4deg);}
    40%{transform:translateX(7px) rotate(0.4deg);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(4px);}
  }
 
  .hidden{display:none !important;}
  .fade-in{animation:fadeIn 0.5s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
 
  label{
    display:block;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--pink);
    text-align:left;
    margin:18px 0 6px;
  }
  input[type="date"], input[type="time"], input[type="text"]{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:6px;
    padding:12px 14px;
    font-size:15px;
    font-family:'Work Sans',sans-serif;
    color:var(--white);
    outline:none;
  }
  input::-webkit-calendar-picker-indicator{filter:invert(1);}
  input:focus{border-color:var(--pink);}
  .field-row{display:flex; gap:14px;}
  .field-row > div{flex:1;}
 
  #confirmBtn{
    margin-top:30px;
    width:100%;
    padding:15px;
    font-size:16px;
    background:var(--pink);
    color:#1a0a14;
  }
  #confirmBtn:hover{background:var(--pink-light);}
  #confirmBtn:disabled{opacity:0.4; cursor:not-allowed;}
 
  .ticket{
    text-align:left;
      }
  .ticket-row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px dashed rgba(255,255,255,0.25);
    font-size:15px;
  }
  .ticket-row:last-child{border-bottom:none;}
  .ticket-row span:first-child{color:var(--pink-light); opacity:0.7;}
  .ticket-row span:last-child{color:var(--white); font-weight:500;}
  .stub{
    text-align:center;
    margin-top:28px;
    font-family:'Fraunces',serif;
    font-style:italic;
    color:var(--pink);
    font-size:15px;
  }
  .confetti{
    position:fixed;
    top:-20px;
    width:8px;
    height:14px;
    z-index:20;
    pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(105vh) rotate(360deg); opacity:0.9;}
  }
  @media (max-width:480px){
    .card{padding:40px 24px;}
    .field-row{flex-direction:column;}
    #noBtn{position:static; margin-top:10px;}
    .btn-row{flex-direction:column; min-height:auto;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
 
<div class="stage" id="stage">
  <div class="curtain curtain-left" id="curtainL"></div>
  <div class="curtain curtain-right" id="curtainR"></div>
  <div class="vignette" id="vignette"></div>
 
  <div class="card" id="card">
 
    <div id="askView">
      <p class="eyebrow">A question, respectfully staged</p>
      <h1 id="headline">Will you hang out with me?</h1>
      <p class="sub" id="subtext">Just a simple yes or no. No pressure.</p>
      <div class="btn-row" id="btnRow">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
      </div>
    </div>
 
    <div id="dateView" class="hidden">
      <p class="eyebrow">Wonderful news</p>
      <h1 style="min-height:0;">Let's set it up</h1>
      <p class="sub">Pick a day, a time, and if you like, a place.</p>
 
      <label for="dateInput">Day</label>
      <div class="field-row">
        <div>
          <input type="date" id="dateInput">
        </div>
        <div>
          <label for="timeInput" style="margin-top:0;">Time</label>
          <input type="time" id="timeInput">
        </div>
      </div>
      <label for="placeInput">Where (optional)</label>
      <input type="text" id="placeInput" placeholder="Wherever you'd like">
 
      <button id="confirmBtn" disabled>Lock it in</button>
    </div>
 
    <div id="ticketView" class="hidden fade-in">
      <p class="eyebrow">Save the plan</p>
      <h1 style="min-height:0;">It's on.</h1>
      <div class="ticket">
        <div class="ticket-row"><span>Day</span><span id="ticketDate"></span></div>
        <div class="ticket-row" id="ticketTimeRow"><span>Time</span><span id="ticketTime"></span></div>
        <div class="ticket-row hidden" id="ticketPlaceRow"><span>Place</span><span id="ticketPlace"></span></div>
      </div>
      <p class="stub">— see you then —</p>
    </div>
 
  </div>
</div>
 
<script>
  const stage = document.getElementById('stage');
  const card = document.getElementById('card');
  const btnRow = document.getElementById('btnRow');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const headline = document.getElementById('headline');
  const subtext = document.getElementById('subtext');
  const curtainL = document.getElementById('curtainL');
  const curtainR = document.getElementById('curtainR');
  const vignette = document.getElementById('vignette');
 
  const stages = [
    { h: "Will you hang out with me?", s: "Just a simple yes or no. No pressure." },
    { h: "Wait, come back.", s: "Perhaps the mouse slipped. Try again?" },
    { h: "The heart does not accept 'no'.", s: "It has filed a formal objection." },
    { h: "Somewhere, a violinist has stopped playing.", s: "This is, understandably, a lot to process." },
    { h: "The curtains have noticed your hesitation.", s: "They are drawing closer, out of concern." },
    { h: "This is now, objectively, a tragedy.", s: "A well-lit, tastefully staged one." },
    { h: "One button remains within reach.", s: "The other has entered its villain era." },
    { h: "Fine. The answer is still just yes.", s: "Whenever you're ready." }
  ];
 
  let noCount = 0;
  const maxDrama = stages.length - 1;
 
  function updateText(){
    const i = Math.min(noCount, maxDrama);
    headline.style.opacity = 0;
    subtext.style.opacity = 0;
    setTimeout(() => {
      headline.textContent = stages[i].h;
      subtext.textContent = stages[i].s;
      headline.style.opacity = 1;
      subtext.style.opacity = 1;
    }, 180);
  }
 
  function dodge(){
    const rowRect = btnRow.getBoundingClientRect();
    const noRect = noBtn.getBoundingClientRect();
    const maxX = Math.max(rowRect.width - noRect.width - 10, 20);
    const maxY = Math.max(rowRect.height - noRect.height - 10, 20);
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  }
 
  function escalate(){
    noCount++;
    const capped = Math.min(noCount, 7);
 
    const curtainWidth = Math.min(capped * 2.2, 16);
    curtainL.style.width = curtainWidth + 'vw';
    curtainR.style.width = curtainWidth + 'vw';
    vignette.style.opacity = Math.min(0.3 + capped * 0.07, 0.8);
 
    const yesScale = Math.min(1 + capped * 0.16, 2.6);
    yesBtn.style.transform = 'scale(' + yesScale + ')';
    yesBtn.style.fontSize = '16px';
 
    const noScale = Math.max(1 - capped * 0.09, 0.35);
    noBtn.style.transform = 'scale(' + noScale + ')';
 
    stage.classList.remove('shake');
    void stage.offsetWidth;
    stage.classList.add('shake');
 
    updateText();
    dodge();
  }
 
  noBtn.addEventListener('pointerenter', () => { if(noCount > 0) dodge(); });
  noBtn.addEventListener('click', escalate);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); escalate(); }, { passive:false });
 
  function confetti(){
    const colors = ['#ff5fa8','#1c3fd6','#ffb3d6','#ffffff'];
    for(let i=0;i<60;i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random()*100 + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (2 + Math.random()*1.5) + 's';
      el.style.animationDelay = (Math.random()*0.6) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }
 
  yesBtn.addEventListener('click', () => {
    curtainL.style.width = '0vw';
    curtainR.style.width = '0vw';
    vignette.style.opacity = 0.12;
    document.getElementById('askView').classList.add('hidden');
    document.getElementById('dateView').classList.remove('hidden');
    document.getElementById('dateView').classList.add('fade-in');
 
    const d = new Date();
    d.setDate(d.getDate() + 3);
    document.getElementById('dateInput').min = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = d.toISOString().split('T')[0];
  });

  const dateInput = document.getElementById('dateInput');
  const confirmBtn = document.getElementById('confirmBtn');
  dateInput.addEventListener('input', () => {
    confirmBtn.disabled = !dateInput.value;
  });
  confirmBtn.disabled = !dateInput.value;
 
  confirmBtn.addEventListener('click', () => {
    const dateVal = document.getElementById('dateInput').value;
    const timeVal = document.getElementById('timeInput').value;
    const placeVal = document.getElementById('placeInput').value.trim();
 
    if(dateVal){
      const dObj = new Date(dateVal + 'T00:00:00');
      document.getElementById('ticketDate').textContent = dObj.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    }
    if(timeVal){
      const [h,m] = timeVal.split(':');
      const t = new Date();
      t.setHours(h, m);
      document.getElementById('ticketTime').textContent = t.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
    } else {
      document.getElementById('ticketTimeRow').classList.add('hidden');
    }
    if(placeVal){
      document.getElementById('ticketPlace').textContent = placeVal;
      document.getElementById('ticketPlaceRow').classList.remove('hidden');
    }
 
    document.getElementById('dateView').classList.add('hidden');
    document.getElementById('ticketView').classList.remove('hidden');
    confetti();
  });
</script>
 
</body>
</html>
